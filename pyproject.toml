[project]
name = "ipbb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cerberus>=1.3.7",
    "click>=8.2.1",
    "click-didyoumean>=0.3.1",
    "configparser>=7.2.0",
    "ipaddress>=1.0.23",
    "ipdb>=0.13.13",
    "ipython>=9.5.0",
    "pexpect>=4.9.0",
    "psutil>=7.0.0",
    "pytest>=8.4.2",
    "pyyaml>=6.0.2",
    "rich>=14.1.0",
    "sh>=2.2.2",
    "vsg>=3.35.0",
    "vunit-hdl>=4.7.0",
]

[project.scripts]
ipbb = "ipbb.console_scripts.builder:main"
ipb-prog = "ipbb.console_scripts.programmer:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
